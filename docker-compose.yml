version: "3.8"

services:
  store-intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store-intelligence-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - "${CLIPS_DIR:-../CCTV Footage}:/app/clips:ro"
    environment:
      - DB_PATH=/app/data/store_intelligence.db
      - CLIPS_DIR=/app/clips
      - LOG_LEVEL=INFO
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
